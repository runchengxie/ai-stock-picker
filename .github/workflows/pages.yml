name: Pages

on:
  push:
    branches: [main]
    paths:
      [
        "site/**",
        "src/**",
        "docs/research/**",
        "docs/zh-CN/research/**",
        "scripts/site/**",
        "tests/site/**",
        "package.json",
        "package-lock.json",
        "astro.config.mjs",
        "tsconfig.json",
        ".github/workflows/pages.yml",
      ]
  pull_request:
    paths:
      [
        "site/**",
        "src/**",
        "docs/research/**",
        "docs/zh-CN/research/**",
        "scripts/site/**",
        "tests/site/**",
        "package.json",
        "package-lock.json",
        "astro.config.mjs",
        "tsconfig.json",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked website dependencies
        run: npm ci
      - name: Check static assets and metric behavior
        run: |
          node --check site/app.js
          node --check site/tool.js
          node --check site/theme.js
          node --test tests/site/*.test.mjs
          python -m json.tool site/locales/en.json > /dev/null
          python -m json.tool site/locales/zh-CN.json > /dev/null
          npm run check
      - name: Download the pinned reviewed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(python -c 'import json; print(json.load(open("site/research-source.json"))["release_tag"])')
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern research.json --dir "$RUNNER_TEMP/aipick-research-download"
      - name: Check provenance and stage the public snapshot
        run: |
          python scripts/site/stage_snapshot.py \
            --snapshot "$RUNNER_TEMP/aipick-research-download/research.json" \
            --output "$RUNNER_TEMP/aipick-research-data/research.json"
      - name: Build the static Astro site
        env:
          AIPICK_RESEARCH_SNAPSHOT: ${{ runner.temp }}/aipick-research-data/research.json
        run: npm run build -- --outDir "$RUNNER_TEMP/aipick-pages-site"
      - name: Add the validated browser data asset
        run: |
          mkdir -p "$RUNNER_TEMP/aipick-pages-site/data"
          cp "$RUNNER_TEMP/aipick-research-data/research.json" \
            "$RUNNER_TEMP/aipick-pages-site/data/research.json"
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload only the staged public site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/aipick-pages-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
